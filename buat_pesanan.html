<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Buat Pesanan - Zahrah</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

<div class="container" style="max-width: 800px;">
    
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h4 class="card-title mb-4"> Buat & Kelola Pesanan</h4>
            <form id="form-pesanan">
                <input type="hidden" id="id_pesanan" value="">

                <div class="mb-3">
                    <label class="form-label fw-bold">Nama Barang</label>
                    <input type="text" class="form-control" id="nama_barang" placeholder="Contoh: baju, seblak, buku" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Jumlah</label>
                    <input type="number" class="form-control" id="jumlah" placeholder="Masukkan jumlah" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Catatan / Detail Ukuran</label>
                    <textarea class="form-control" id="catatan" rows="3" placeholder="Contoh: warna hitam, ukuran xl"></textarea>
                </div>
                <button type="submit" id="btn-submit" class="btn btn-primary w-100">Kirim Pesanan</button>
                <button type="button" id="btn-batal" class="btn btn-secondary w-100 mt-2 d-none" onclick="resetForm()">Batal Edit</button>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <span class="fw-bold">Daftar Pesanan Saya</span>
            <button class="btn btn-sm btn-outline-secondary" onclick="muatData()">Muat Ulang</button>
        </div>
        <div class="card-body p-0">
            <table class="table table-striped mb-0">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Nama Barang</th>
                        <th>Jumlah</th>
                        <th>Status</th>
                        <th class="text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tabel-pesanan">
                    </tbody>
            </table>
        </div>
    </div>
</div>

<script>
const apiURL = 'api/pesanan.php';

// 1. FUNGSI READ (Ambil Data dari API dan Tampilkan ke Tabel)
function muatData() {
    const tabel = document.getElementById('tabel-pesanan');
    tabel.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Sedang memuat data dari API...</td></tr>';

    fetch(apiURL)
        .then(res => res.json())
        .then(hasil => {
            tabel.innerHTML = '';
            if (hasil.status === 'success' && hasil.data.length > 0) {
                hasil.data.forEach(p => {
                    tabel.innerHTML += `
                        <tr>
                            <td>${p.id}</td>
                            <td><strong>${p.nama_barang}</strong><br><small class="text-muted">${p.catatan ? p.catatan : '-'}</small></td>
                            <td>${p.jumlah}</td>
                            <td><span class="badge bg-warning text-dark">${p.status}</span></td>
                            <td class="text-center">
                                <button class="btn btn-warning btn-sm" onclick="isiFormEdit(${p.id})">Edit</button>
                                <button class="btn btn-danger btn-sm" onclick="hapusData(${p.id})">Hapus</button>
                            </td>
                        </tr>
                    `;
                });
            } else {
                tabel.innerHTML = '<tr><td colspan="5" class="text-center text-danger">Belum ada data pesanan.</td></tr>';
            }
        })
        .catch(err => {
            tabel.innerHTML = '<tr><td colspan="5" class="text-center text-danger">Gagal memuat data dari API.</td></tr>';
        });
}

// 2. FUNGSI CREATE & UPDATE (Kirim Form)
document.getElementById('form-pesanan').addEventListener('submit', function(e) {
    e.preventDefault();

    const id = document.getElementById('id_pesanan').value;
    const nama_barang = document.getElementById('nama_barang').value;
    const jumlah = document.getElementById('jumlah').value;
    const catatan = document.getElementById('catatan').value;

    const dataKirim = { nama_barang, jumlah, catatan };
    let methodKosong = 'POST'; // Default tambah data baru

    if (id) {
        methodKosong = 'PUT'; // Jika ID terisi, ganti ke mode edit data
        dataKirim.id = id;
    }

    fetch(apiURL, {
        method: methodKosong,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dataKirim)
    })
    .then(res => res.json())
    .then(hasil => {
        if (hasil.status === 'success') {
            alert(hasil.message);
            resetForm();
            muatData();
        } else {
            alert('Gagal mengeksekusi perintah: ' + hasil.message);
        }
    })
    .catch(err => {
        alert('Terjadi kesalahan saat mengirim data.');
    });
});

// 3. FUNGSI UNTUK MENARIK DATA KELALUAN KE FORM SAAT KLIK EDIT
function isiFormEdit(id) {
    fetch(`${apiURL}?id=${id}`)
        .then(res => res.json())
        .then(hasil => {
            if (hasil.status === 'success') {
                document.getElementById('id_pesanan').value = hasil.data.id;
                document.getElementById('nama_barang').value = hasil.data.nama_barang;
                document.getElementById('jumlah').value = hasil.data.jumlah;
                document.getElementById('catatan').value = hasil.data.catatan;

                document.getElementById('btn-submit').innerText = 'Simpan Perubahan (Update)';
                document.getElementById('btn-submit').className = 'btn btn-success w-100';
                document.getElementById('btn-batal').classList.remove('d-none');
            }
        });
}

// 4. FUNGSI DELETE (Hapus Data)
function hapusData(id) {
    if (confirm('Yakin ingin menghapus pesanan ID ' + id + '?')) {
        fetch(apiURL, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: id })
        })
        .then(res => res.json())
        .then(hasil => {
            alert(hasil.message);
            muatData();
        })
        .catch(err => alert('Gagal menghapus data'));
    }
}

// Reset Form ke Setelan Awal
function resetForm() {
    document.getElementById('id_pesanan').value = '';
    document.getElementById('form-pesanan').reset();
    document.getElementById('btn-submit').innerText = 'Kirim Pesanan';
    document.getElementById('btn-submit').className = 'btn btn-primary w-100';
    document.getElementById('btn-batal').classList.add('d-none');
}

// Muat data otomatis saat pertama kali halaman diakses
window.onload = muatData;
</script>

</body>
</html>
