<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Riwayat Pesanan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="nav-container">
        <a href="profile.php" class="btn-nav">← Kembali ke Profil</a>
    </div>

    <div class="main-title">Riwayat Pesanan</div>

    <div class="card">
        <div class="card-title">Tambah Riwayat Pesanan</div>
        <form id="formPesanan" enctype="multipart/form-data">
            <div class="form-group">
                <label>Nama Barang</label>
                <input type="text" id="inputBarang" class="form-control" placeholder="Nama Barang" required>
            </div>
            <div class="form-group">
                <label>Status</label>
                <select id="inputStatus" class="form-control">
                    <option value="Diproses">Diproses</option>
                    <option value="Diterima">Diterima</option>
                    <option value="Sampai">Sampai</option>
                </select>
            </div>
            <div class="form-group">
                <label>Bukti Penerimaan</label>
                <input type="file" id="inputFoto" class="form-control">
            </div>
            <button type="submit" class="btn-submit">Simpan Pesanan</button>
        </form>
    </div>

    <div class="card">
        <div class="card-title">Data Riwayat Pesanan</div>
        <table>
            <thead>
                <tr>
                    <th style="width: 25%;">Barang</th>
                    <th style="width: 15%;">Status</th>
                    <th style="width: 20%;">Bukti</th>
                    <th style="width: 40%;">Aksi</th>
                </tr>
            </thead>
            <tbody id="tabelPesanan"></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
